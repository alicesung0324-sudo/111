<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級座位大風吹 v3.1</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        /* 列印專屬樣式設定 */
        @media print {
            body {
                background: white;
            }
            @page {
                size: A4 landscape; /* 預設橫向列印 */
                margin: 0.5cm;
            }
            .print-hide {
                display: none !important;
            }
            .print-fullscreen {
                width: 100% !important;
                height: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
                background-color: white !important;
                box-shadow: none !important;
                border: none !important;
            }
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
        
        /* 平滑捲動 */
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body class="bg-gray-200 text-gray-800 font-sans">
    <!-- React 應用程式的掛載點 -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 共用的工具按鈕元件
        const ToolButton = ({ mode, current, onClick, children }) => {
            const isActive = current === mode;
            return (
                <button
                    onClick={() => onClick(mode)}
                    className={`py-2 px-2 text-sm md:text-base rounded-lg border font-medium transition-colors w-full shadow-sm ${
                        isActive 
                        ? 'bg-indigo-600 text-white border-indigo-600 shadow-inner' 
                        : 'bg-white text-gray-700 hover:bg-gray-50 border-gray-300'
                    }`}
                >
                    {children}
                </button>
            );
        };

        const App = () => {
            const [rows, setRows] = useState(6);
            const [cols, setCols] = useState(6);
            // 預設為空字串，不再出現預設名單
            const [studentText, setStudentText] = useState("");
            const [seats, setSeats] = useState([]);
            const [mode, setMode] = useState('normal'); 
            const [swapSource, setSwapSource] = useState(null);
            const [view, setView] = useState('student'); // 'student' 或是 'teacher'
            const [history, setHistory] = useState([]);

            // 紀錄歷史狀態（用於「回上一步」）
            const saveHistory = (currentSeats) => {
                setHistory(prev => [...prev, JSON.stringify(currentSeats)]);
            };

            const handleUndo = () => {
                if (history.length > 0) {
                    const prevStr = history[history.length - 1];
                    setSeats(JSON.parse(prevStr));
                    setHistory(prev => prev.slice(0, -1));
                    setSwapSource(null);
                }
            };

            // 建立全新的座位網格
            const handleCreateGrid = () => {
                if (seats.some(s => s.studentName)) {
                    if (!confirm("重新建立教室將會清空所有目前的座位安排，確定嗎？")) return;
                }
                saveHistory(seats);
                const newSeats = [];
                for (let i = 0; i < rows * cols; i++) {
                    newSeats.push({ id: i, status: 'normal', studentName: '', studentNum: '' });
                }
                setSeats(newSeats);
                setSwapSource(null);
                
                // 建立後自動往上捲動看結果
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            // 第一次載入時自動產生網格
            useEffect(() => {
                if (seats.length === 0) {
                    const newSeats = [];
                    for (let i = 0; i < rows * cols; i++) {
                        newSeats.push({ id: i, status: 'normal', studentName: '', studentNum: '' });
                    }
                    setSeats(newSeats);
                }
            }, []);

            // 隨機分配座位邏輯
            const handleGenerate = () => {
                // 以換行符號分割，處理從 Excel 貼上的資料
                let lines = studentText.split('\n').map(n => n.trim()).filter(n => n);
                
                // 解析座號與姓名 (例如："06 王小明" 或 "06\t王小明")
                let parsedStudents = lines.map(line => {
                    const parts = line.split(/[\s\t]+/); // 用空格或 Tab 切割
                    // 如果切割後有多個部分，且第一部分看起來像數字（座號）
                    if (parts.length >= 2 && /^[0-9A-Za-z]+$/.test(parts[0])) {
                        return { num: parts[0], name: parts.slice(1).join(' ') };
                    }
                    // 否則就整行當作姓名
                    return { num: '', name: line };
                });
                
                let lockedNames = [];
                let availableSeats = [];
                
                // 找出已經鎖定的學生與可用的空位
                seats.forEach((seat, idx) => {
                    if (seat.status === 'locked' && seat.studentName) {
                        lockedNames.push(seat.studentName); // 用姓名判斷是否已在座
                    } else if (seat.status !== 'disabled' && seat.status !== 'locked') {
                        availableSeats.push(idx);
                    }
                });

                // 過濾掉已經被鎖定在座位上的學生，避免重複分配
                let studentsToAssign = parsedStudents.filter(stu => !lockedNames.includes(stu.name));

                if (studentsToAssign.length > availableSeats.length) {
                    alert(`座位不夠！需要排入 ${studentsToAssign.length} 人，但只有 ${availableSeats.length} 個可用座位。請增加教室行列數，或減少名單。`);
                    return;
                }

                // 隨機打亂學生陣列 (Fisher-Yates Shuffle)
                for (let i = studentsToAssign.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [studentsToAssign[i], studentsToAssign[j]] = [studentsToAssign[j], studentsToAssign[i]];
                }

                saveHistory(seats);
                const newSeats = [...seats];

                // 先清空所有未鎖定的座位，避免留有舊資料
                availableSeats.forEach(idx => {
                    newSeats[idx] = { ...newSeats[idx], studentName: '', studentNum: '' };
                });

                // 依序將打亂後的學生填入可用座位
                studentsToAssign.forEach((stu, i) => {
                    const seatIdx = availableSeats[i];
                    newSeats[seatIdx] = { ...newSeats[seatIdx], studentName: stu.name, studentNum: stu.num };
                });

                setSeats(newSeats);
                
                // 分配完成後自動捲動回頂部看結果
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            // 處理個別座位點擊（根據當前選擇的工具模式）
            const handleSeatClick = (idx) => {
                if (mode === 'normal') return;

                // 交換座位模式邏輯
                if (mode === 'swap') {
                    if (seats[idx].status === 'disabled') return;
                    if (swapSource === null) {
                        setSwapSource(idx);
                    } else if (swapSource === idx) {
                        setSwapSource(null);
                    } else {
                        saveHistory(seats);
                        const newSeats = [...seats];
                        const tempName = newSeats[swapSource].studentName;
                        const tempNum = newSeats[swapSource].studentNum;
                        
                        newSeats[swapSource] = { ...newSeats[swapSource], studentName: newSeats[idx].studentName, studentNum: newSeats[idx].studentNum };
                        newSeats[idx] = { ...newSeats[idx], studentName: tempName, studentNum: tempNum };
                        setSeats(newSeats);
                        setSwapSource(null);
                    }
                    return;
                }

                saveHistory(seats);
                const newSeats = [...seats];
                const seat = { ...newSeats[idx] };

                if (mode === 'disable') {
                    if (seat.status === 'disabled') {
                        seat.status = 'normal';
                    } else {
                        seat.status = 'disabled';
                        seat.studentName = '';
                        seat.studentNum = '';
                    }
                } else if (mode === 'lock') {
                    if (seat.status === 'locked') {
                        seat.status = 'normal';
                    } else if (seat.status === 'normal' && seat.studentName) {
                        seat.status = 'locked';
                    }
                }
                
                newSeats[idx] = seat;
                setSeats(newSeats);
                setSwapSource(null);
            };

            const handleClearSeats = () => {
                if (!confirm("確定要清空所有已分配的學生嗎？（保留空位與鎖定設定）")) return;
                saveHistory(seats);
                setSeats(seats.map(s => s.status === 'locked' || s.status === 'disabled' ? s : { ...s, studentName: '', studentNum: '' }));
            };

            const handleClearAll = () => {
                if (!confirm("確定要完全重置（清空設定與名單）嗎？")) return;
                saveHistory(seats);
                setStudentText("");
                const newSeats = [];
                for (let i = 0; i < rows * cols; i++) {
                    newSeats.push({ id: i, status: 'normal', studentName: '', studentNum: '' });
                }
                setSeats(newSeats);
            };

            return (
                <div className="flex flex-col font-sans print:block bg-gray-200">
                    
                    {/* ===== 上方主畫面：座位表 (改為佔滿第一頁 90vh 高度，避免被裁切、支援列印) ===== */}
                    <div className="w-full h-[90dvh] p-2 md:p-6 print-fullscreen flex flex-col items-center justify-center relative bg-gray-200">
                        {/* 教室外框限制最大寬高，現在空間更充裕了 */}
                        <div className="w-full h-full max-w-[95%] lg:max-w-[85%] xl:max-w-7xl bg-white rounded-3xl shadow-xl print:shadow-none p-4 md:p-6 flex flex-col items-center relative overflow-hidden">
                            
                            <div className="hidden print:block text-2xl font-bold mb-4 text-center text-black flex-shrink-0">
                                班級座位表 <span className="text-base font-normal text-gray-600 ml-2">({view === 'student' ? '學生視角' : '教師視角'})</span>
                            </div>

                            {/* 動態旋轉與自適應高度的座位區 */}
                            <div 
                                className="flex flex-col items-center w-full h-full transition-transform duration-700 ease-in-out"
                                style={{ transform: view === 'teacher' ? 'rotate(180deg)' : 'rotate(0deg)' }}
                            >
                                {/* 黑板指示器：稍微縮小高度以節省垂直空間 */}
                                <div className="w-[80%] md:w-[60%] h-10 md:h-14 flex-shrink-0 bg-gray-800 text-white flex items-center justify-center rounded-xl mb-3 sm:mb-5 shadow-inner border-b-4 border-gray-900">
                                    <span 
                                        className="text-lg sm:text-2xl font-bold tracking-[0.3em]"
                                        style={{ transform: view === 'teacher' ? 'rotate(180deg)' : 'rotate(0deg)' }}
                                    >
                                        🖥️ 黑板 / 大屏 🖥️
                                    </span>
                                </div>

                                {/* 座位陣列：利用 gridTemplateRows 讓格子高度自動撐滿，加上 min-h-0 避免內容強制撐開 */}
                                <div 
                                    className="w-full flex-1 grid gap-2 sm:gap-3 pb-2 min-h-0"
                                    style={{ 
                                        gridTemplateColumns: `repeat(${cols}, minmax(0, 1fr))`,
                                        gridTemplateRows: `repeat(${rows}, minmax(0, 1fr))`
                                    }}
                                >
                                    {seats.map((seat, idx) => {
                                        let bgColor = "bg-white";
                                        let textColor = "text-gray-800";
                                        let border = "border-2 border-gray-200";
                                        let shadow = "shadow-sm";

                                        if (seat.status === 'disabled') {
                                            bgColor = "bg-gray-100";
                                            border = "border-2 border-gray-300 border-dashed";
                                            textColor = "text-gray-400";
                                            shadow = "shadow-none";
                                        } else if (seat.status === 'locked') {
                                            bgColor = "bg-amber-50";
                                            border = "border-2 border-amber-400";
                                            textColor = "text-amber-900";
                                        } else if (seat.studentName) {
                                            bgColor = "bg-blue-50";
                                            border = "border-2 border-blue-300";
                                            textColor = "text-blue-900";
                                        }

                                        if (swapSource === idx) {
                                            border = "border-4 border-red-500 ring-2 ring-red-200";
                                        }

                                        return (
                                            <div
                                                key={seat.id}
                                                onClick={() => handleSeatClick(idx)}
                                                className={`w-full h-full rounded-lg md:rounded-xl cursor-pointer ${bgColor} ${border} ${shadow} transition-all duration-200 hover:shadow-md hover:-translate-y-0.5 ${mode !== 'normal' ? 'hover:ring-4 hover:ring-indigo-300' : ''} relative overflow-hidden flex flex-col items-center justify-center`}
                                            >
                                                <div 
                                                    className="w-full h-full flex flex-col items-center justify-center select-none p-1 md:p-2 overflow-hidden"
                                                    style={{ transform: view === 'teacher' ? 'rotate(180deg)' : 'rotate(0deg)', transition: 'transform 0.7s ease-in-out' }}
                                                >
                                                    {/* 若為空位 */}
                                                    {seat.status === 'disabled' && <div className="text-3xl md:text-5xl">❌</div>}
                                                    
                                                    {/* 分兩排顯示：上方座號（小字），下方姓名（大字） */}
                                                    {seat.status !== 'disabled' && (
                                                        <>
                                                            {seat.studentNum && (
                                                                <div className="text-xs sm:text-sm md:text-base text-gray-500 font-bold mb-1 leading-none flex-shrink-0">
                                                                    {seat.studentNum}
                                                                </div>
                                                            )}
                                                            {/* 微調：稍微收斂字體最大值，並調整行距避免文字上下被切平 */}
                                                            <div className={`text-center font-black leading-tight break-words ${seat.studentNum ? 'text-xl sm:text-2xl md:text-3xl lg:text-4xl' : 'text-2xl sm:text-3xl md:text-4xl lg:text-5xl'} ${textColor}`}>
                                                                {seat.studentName}
                                                            </div>
                                                        </>
                                                    )}
                                                    
                                                    {/* 鎖定小圖示 */}
                                                    {seat.status === 'locked' && (
                                                        <div className="absolute top-1 right-1 p-1 text-xs md:text-sm flex-shrink-0">🔒</div>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>

                        {/* 提示往下滑動的按鈕 (列印時隱藏) */}
                        <div 
                            className="absolute bottom-1 md:bottom-2 left-1/2 transform -translate-x-1/2 flex flex-col items-center text-gray-500 hover:text-gray-800 opacity-80 hover:opacity-100 transition-all cursor-pointer print-hide z-10"
                            onClick={() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' })}
                        >
                            <span className="text-xs md:text-sm mb-1 font-bold tracking-widest">設定工作區</span>
                            <svg className="w-5 h-5 md:w-6 md:h-6 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
                        </div>
                    </div>

                    {/* ===== 下方控制面板：功能選項 (已經移至第二頁，無高度限制) ===== */}
                    <div className="w-full bg-white border-t-2 border-gray-300 shadow-[0_-15px_20px_-10px_rgba(0,0,0,0.1)] print-hide py-8 pb-16">
                        <div className="max-w-7xl mx-auto px-4 md:px-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                            
                            {/* 1. 教室設定 & 視角 */}
                            <div className="bg-gray-50 p-5 rounded-xl border border-gray-200 shadow-sm flex flex-col">
                                <h2 className="text-base font-bold text-gray-700 mb-3">🛠️ 1. 教室設定與視角</h2>
                                <div className="flex gap-3 mb-4">
                                    <div className="flex-1">
                                        <label className="block text-sm text-gray-500 mb-1">直行 (前至後)</label>
                                        <input type="number" min="1" max="20" className="border border-gray-300 p-2 w-full rounded text-base outline-none focus:ring-2 focus:ring-indigo-400" value={rows} onChange={e => setRows(Math.max(1, parseInt(e.target.value) || 1))} />
                                    </div>
                                    <div className="flex-1">
                                        <label className="block text-sm text-gray-500 mb-1">橫列 (左至右)</label>
                                        <input type="number" min="1" max="20" className="border border-gray-300 p-2 w-full rounded text-base outline-none focus:ring-2 focus:ring-indigo-400" value={cols} onChange={e => setCols(Math.max(1, parseInt(e.target.value) || 1))} />
                                    </div>
                                    <div className="flex-none flex items-end">
                                        <button onClick={handleCreateGrid} className="bg-indigo-100 text-indigo-700 px-4 py-2 h-[42px] rounded-lg text-sm hover:bg-indigo-200 font-bold transition-colors">套用</button>
                                    </div>
                                </div>
                                <div className="flex gap-2 bg-white p-1.5 rounded-lg border border-gray-200 mt-auto">
                                    <button onClick={() => {setView('student'); window.scrollTo({ top: 0, behavior: 'smooth' });}} className={`flex-1 py-2 text-sm font-medium rounded-md transition-colors ${view==='student'?'bg-indigo-600 text-white shadow-md':'text-gray-600 hover:bg-gray-100'}`}>🧑‍🎓 學生視角</button>
                                    <button onClick={() => {setView('teacher'); window.scrollTo({ top: 0, behavior: 'smooth' });}} className={`flex-1 py-2 text-sm font-medium rounded-md transition-colors ${view==='teacher'?'bg-indigo-600 text-white shadow-md':'text-gray-600 hover:bg-gray-100'}`}>🧑‍🏫 教師視角</button>
                                </div>
                            </div>

                            {/* 2. 學生名單 */}
                            <div className="bg-gray-50 p-5 rounded-xl border border-gray-200 shadow-sm flex flex-col">
                                <h2 className="text-base font-bold text-gray-700 mb-3 flex justify-between items-end">
                                    <span>📝 2. 學生名單</span>
                                    <span className="text-xs text-gray-400 font-normal">可從Excel貼上(座號 姓名)</span>
                                </h2>
                                <textarea
                                    className="border border-gray-300 p-3 rounded-lg w-full flex-1 resize-none text-sm outline-none focus:ring-2 focus:ring-indigo-400 min-h-[120px] mb-3"
                                    placeholder="例如：&#10;01 王小明&#10;02 林美麗"
                                    value={studentText}
                                    onChange={e => setStudentText(e.target.value)}
                                />
                                <button onClick={handleGenerate} className="w-full bg-green-500 text-white py-3 rounded-lg hover:bg-green-600 text-base font-bold shadow-md transition-colors flex items-center justify-center gap-2">
                                    🎲 隨機排座
                                </button>
                            </div>

                            {/* 3. 座位微調 */}
                            <div className="bg-gray-50 p-5 rounded-xl border border-gray-200 shadow-sm flex flex-col">
                                <h2 className="text-base font-bold text-gray-700 mb-3 flex justify-between items-end">
                                    <span>⚙️ 3. 座位微調</span>
                                    <span className="text-xs text-gray-400 font-normal">點選模式後，再往上滑點座位</span>
                                </h2>
                                <div className="grid grid-cols-2 gap-3 mb-auto">
                                    <ToolButton mode="normal" current={mode} onClick={setMode}>🖱️ 一般點擊</ToolButton>
                                    <ToolButton mode="disable" current={mode} onClick={setMode}>🚫 設為空位</ToolButton>
                                    <ToolButton mode="lock" current={mode} onClick={setMode}>🔒 鎖定/解鎖</ToolButton>
                                    <ToolButton mode="swap" current={mode} onClick={setMode}>🔄 交換座位</ToolButton>
                                </div>
                                <div className="mt-4 p-3 bg-blue-50 border border-blue-100 rounded-lg text-xs text-blue-700">
                                    💡 提示：先在這裡選擇工具，然後向上捲動點擊上方的座位表。
                                </div>
                            </div>

                            {/* 4. 系統操作 */}
                            <div className="bg-gray-50 p-5 rounded-xl border border-gray-200 shadow-sm flex flex-col justify-between">
                                <div>
                                    <h2 className="text-base font-bold text-gray-700 mb-3">💻 4. 系統操作</h2>
                                    <div className="flex gap-3 mb-3">
                                        <button onClick={handleUndo} disabled={history.length===0} className="flex-1 py-2.5 bg-gray-200 text-gray-700 rounded-lg disabled:opacity-50 hover:bg-gray-300 text-sm font-bold shadow-sm transition-colors">↩️ 復原</button>
                                        <button onClick={handleClearSeats} className="flex-1 py-2.5 bg-yellow-100 text-yellow-700 rounded-lg hover:bg-yellow-200 text-sm font-bold shadow-sm transition-colors">🧹 清空</button>
                                    </div>
                                    <button onClick={handleClearAll} className="w-full py-2.5 bg-red-100 text-red-600 rounded-lg hover:bg-red-200 text-sm font-bold shadow-sm transition-colors mb-4">🗑️ 重置全部設定</button>
                                </div>
                                <button onClick={() => window.print()} className="w-full py-3 bg-indigo-600 text-white font-bold rounded-lg shadow-md hover:bg-indigo-700 text-base flex items-center justify-center gap-2 transition-transform hover:-translate-y-0.5">
                                    🖨️ 列印 / 儲存 PDF
                                </button>
                            </div>
                            
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
