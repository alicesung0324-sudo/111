<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級座位大風吹 v2.2</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        /* 列印專屬樣式設定 */
        @media print {
            body {
                background: white;
            }
            @page {
                size: A4 landscape; /* 預設橫向列印 */
                margin: 0.5cm; /*稍微縮小邊界以容納更大字體*/
            }
            .print-hide {
                display: none !important;
            }
            .print-fullscreen {
                width: 100% !important;
                height: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
                background-color: white !important;
                box-shadow: none !important;
            }
            /* 強制列印背景顏色，保留座位顏色與狀態 */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            /* 列印時稍微縮小字體以防破版 */
            .print-text-adjust {
                font-size: 1.8rem !important; 
                line-height: 1 !important;
            }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 h-screen overflow-hidden">
    <!-- React 應用程式的掛載點 -->
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 共用的工具按鈕元件
        const ToolButton = ({ mode, current, onClick, children }) => {
            const isActive = current === mode;
            return (
                <button
                    onClick={() => onClick(mode)}
                    className={`py-2 px-1 text-sm rounded border font-medium transition-colors ${
                        isActive 
                        ? 'bg-indigo-600 text-white border-indigo-600 shadow-inner' 
                        : 'bg-white text-gray-700 hover:bg-gray-100 border-gray-300'
                    }`}
                >
                    {children}
                </button>
            );
        };

        const App = () => {
            const [rows, setRows] = useState(6);
            const [cols, setCols] = useState(6);
            // 預設一些假資料方便測試
            const [studentText, setStudentText] = useState("王小明\n陳大文\n林美麗\n張建國\n李心怡\n劉建宏\n黃雅婷\n趙宇軒\n陳怡君\n林柏翰");
            const [seats, setSeats] = useState([]);
            const [mode, setMode] = useState('normal'); 
            const [swapSource, setSwapSource] = useState(null);
            const [view, setView] = useState('student'); // 'student' 或是 'teacher'
            const [history, setHistory] = useState([]);

            // 紀錄歷史狀態（用於「回上一步」）
            const saveHistory = (currentSeats) => {
                setHistory(prev => [...prev, JSON.stringify(currentSeats)]);
            };

            const handleUndo = () => {
                if (history.length > 0) {
                    const prevStr = history[history.length - 1];
                    setSeats(JSON.parse(prevStr));
                    setHistory(prev => prev.slice(0, -1));
                    setSwapSource(null);
                }
            };

            // 建立全新的座位網格
            const handleCreateGrid = () => {
                if (seats.some(s => s.studentName)) {
                    if (!confirm("重新建立教室將會清空所有目前的座位安排，確定嗎？")) return;
                }
                saveHistory(seats);
                const newSeats = [];
                for (let i = 0; i < rows * cols; i++) {
                    newSeats.push({ id: i, status: 'normal', studentName: '' });
                }
                setSeats(newSeats);
                setSwapSource(null);
            };

            // 第一次載入時自動產生網格
            useEffect(() => {
                if (seats.length === 0) {
                    const newSeats = [];
                    for (let i = 0; i < rows * cols; i++) {
                        newSeats.push({ id: i, status: 'normal', studentName: '' });
                    }
                    setSeats(newSeats);
                }
            }, []);

            // 隨機分配座位邏輯
            const handleGenerate = () => {
                // 處理換行或空格分隔的名字
                let names = studentText.split(/[\n\s,、]+/).map(n => n.trim()).filter(n => n);
                
                let lockedNames = [];
                let availableSeats = [];
                
                // 找出已經鎖定的學生與可用的空位
                seats.forEach((seat, idx) => {
                    if (seat.status === 'locked' && seat.studentName) {
                        lockedNames.push(seat.studentName);
                    } else if (seat.status !== 'disabled' && seat.status !== 'locked') {
                        availableSeats.push(idx);
                    }
                });

                // 過濾掉已經被鎖定在座位上的學生，避免重複分配
                let namesToAssign = names.filter(n => !lockedNames.includes(n));

                if (namesToAssign.length > availableSeats.length) {
                    alert(`座位不夠！需要排入 ${namesToAssign.length} 人，但只有 ${availableSeats.length} 個可用座位。請增加教室行列數，或減少名單。`);
                    return;
                }

                // 隨機打亂學生陣列 (Fisher-Yates Shuffle)
                for (let i = namesToAssign.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [namesToAssign[i], namesToAssign[j]] = [namesToAssign[j], namesToAssign[i]];
                }

                saveHistory(seats);
                const newSeats = [...seats];

                // 先清空所有未鎖定的座位，避免留有舊資料
                availableSeats.forEach(idx => {
                    newSeats[idx] = { ...newSeats[idx], studentName: '' };
                });

                // 依序將打亂後的學生填入可用座位
                namesToAssign.forEach((name, i) => {
                    const seatIdx = availableSeats[i];
                    newSeats[seatIdx] = { ...newSeats[seatIdx], studentName: name };
                });

                setSeats(newSeats);
            };

            // 處理個別座位點擊（根據當前選擇的工具模式）
            const handleSeatClick = (idx) => {
                if (mode === 'normal') return;

                // 交換座位模式邏輯
                if (mode === 'swap') {
                    if (seats[idx].status === 'disabled') return;
                    if (swapSource === null) {
                        setSwapSource(idx); // 選取第一個座位
                    } else if (swapSource === idx) {
                        setSwapSource(null); // 取消選取
                    } else {
                        // 執行交換
                        saveHistory(seats);
                        const newSeats = [...seats];
                        const tempName = newSeats[swapSource].studentName;
                        newSeats[swapSource] = { ...newSeats[swapSource], studentName: newSeats[idx].studentName };
                        newSeats[idx] = { ...newSeats[idx], studentName: tempName };
                        setSeats(newSeats);
                        setSwapSource(null);
                    }
                    return;
                }

                saveHistory(seats);
                const newSeats = [...seats];
                const seat = { ...newSeats[idx] };

                // 設為空位 / 取消空位
                if (mode === 'disable') {
                    if (seat.status === 'disabled') {
                        seat.status = 'normal';
                    } else {
                        seat.status = 'disabled';
                        seat.studentName = '';
                    }
                } 
                // 鎖定 / 解鎖座位
                else if (mode === 'lock') {
                    if (seat.status === 'locked') {
                        seat.status = 'normal';
                    } else if (seat.status === 'normal' && seat.studentName) {
                        seat.status = 'locked';
                    }
                }
                
                newSeats[idx] = seat;
                setSeats(newSeats);
                setSwapSource(null);
            };

            // 清空分配好的學生（保留已設定的Ｘ空位與鎖定座位）
            const handleClearSeats = () => {
                if (!confirm("確定要清空所有已分配的學生嗎？（保留空位與鎖定設定）")) return;
                saveHistory(seats);
                setSeats(seats.map(s => s.status === 'locked' || s.status === 'disabled' ? s : { ...s, studentName: '' }));
            };

            // 完全重置
            const handleClearAll = () => {
                if (!confirm("確定要完全重置（清空設定與名單）嗎？")) return;
                saveHistory(seats);
                setStudentText("");
                const newSeats = [];
                for (let i = 0; i < rows * cols; i++) {
                    newSeats.push({ id: i, status: 'normal', studentName: '' });
                }
                setSeats(newSeats);
            };

            return (
                <div className="flex h-full font-sans print:block">
                    
                    {/* 左側邊欄：控制面板 (列印時隱藏) */}
                    <div className="w-80 bg-white shadow-xl flex flex-col z-10 print-hide h-full shrink-0">
                        <div className="p-4 border-b bg-indigo-50">
                            <h1 className="text-xl font-bold text-indigo-700 flex items-center gap-2">
                                🏫 座位大風吹 <span className="text-sm font-normal text-indigo-500">v2.2</span>
                            </h1>
                        </div>

                        <div className="flex-1 overflow-y-auto">
                            {/* 視角切換器 */}
                            <div className="p-4 border-b bg-white">
                                <h2 className="font-semibold text-gray-700 mb-3 flex items-center gap-1">👀 視角切換</h2>
                                <div className="flex gap-2">
                                    <button 
                                        onClick={() => setView('student')} 
                                        className={`flex-1 py-2 rounded font-medium transition-colors ${view==='student'?'bg-indigo-600 text-white shadow-md':'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}
                                    >
                                        🧑‍🎓 學生視角
                                    </button>
                                    <button 
                                        onClick={() => setView('teacher')} 
                                        className={`flex-1 py-2 rounded font-medium transition-colors ${view==='teacher'?'bg-indigo-600 text-white shadow-md':'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}
                                    >
                                        🧑‍🏫 教師視角
                                    </button>
                                </div>
                                <p className="text-xs text-gray-500 mt-2">
                                    {view === 'student' ? '黑板在上方，適合使用投影機投影給學生看' : '黑板在下方，適合教師站在講台上俯瞰'}
                                </p>
                            </div>

                            {/* 1. 教室設定 */}
                            <div className="p-4 border-b">
                                <h2 className="font-semibold text-gray-700 mb-3">🛠️ 1. 教室設定</h2>
                                <div className="flex gap-4 mb-3">
                                    <div className="flex-1">
                                        <label className="block text-xs text-gray-500 mb-1">直行 (前至後)</label>
                                        <input type="number" min="1" max="20" className="border border-gray-300 p-2 w-full rounded focus:ring-2 focus:ring-indigo-400 outline-none" value={rows} onChange={e => setRows(Math.max(1, parseInt(e.target.value) || 1))} />
                                    </div>
                                    <div className="flex-1">
                                        <label className="block text-xs text-gray-500 mb-1">橫列 (左至右)</label>
                                        <input type="number" min="1" max="20" className="border border-gray-300 p-2 w-full rounded focus:ring-2 focus:ring-indigo-400 outline-none" value={cols} onChange={e => setCols(Math.max(1, parseInt(e.target.value) || 1))} />
                                    </div>
                                </div>
                                <button onClick={handleCreateGrid} className="w-full bg-indigo-50 text-indigo-700 py-2 rounded hover:bg-indigo-100 font-medium border border-indigo-200 transition-colors">
                                    建立空白座位表
                                </button>
                            </div>

                            {/* 2. 學生名單 */}
                            <div className="p-4 border-b flex flex-col">
                                <h2 className="font-semibold text-gray-700 mb-3">📝 2. 學生名單</h2>
                                <textarea
                                    className="border border-gray-300 p-3 rounded w-full h-32 resize-none focus:ring-2 focus:ring-indigo-400 outline-none text-sm leading-relaxed"
                                    placeholder="貼上學生姓名，可用換行或空格分隔..."
                                    value={studentText}
                                    onChange={e => setStudentText(e.target.value)}
                                />
                                <div className="text-xs text-gray-500 mt-1 mb-3 text-right">
                                    當前名單共 {studentText.split(/[\n\s,、]+/).filter(n => n.trim()).length} 人
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={handleGenerate} className="flex-1 bg-green-500 text-white py-2 rounded hover:bg-green-600 font-medium shadow-sm transition-colors text-base">
                                        🎲 隨機排座
                                    </button>
                                </div>
                            </div>

                            {/* 3. 微調工具 */}
                            <div className="p-4 border-b">
                                <h2 className="font-semibold text-gray-700 mb-3 flex justify-between items-end">
                                    <span>⚙️ 3. 座位微調</span>
                                    <span className="text-xs text-gray-400 font-normal">先選模式再點座位</span>
                                </h2>
                                <div className="grid grid-cols-2 gap-2 mb-3">
                                    <ToolButton mode="normal" current={mode} onClick={setMode}>🖱️ 一般點擊</ToolButton>
                                    <ToolButton mode="disable" current={mode} onClick={setMode}>🚫 設為空位</ToolButton>
                                    <ToolButton mode="lock" current={mode} onClick={setMode}>🔒 鎖定/解鎖</ToolButton>
                                    <ToolButton mode="swap" current={mode} onClick={setMode}>🔄 交換座位</ToolButton>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={handleUndo} disabled={history.length===0} className="flex-1 py-2 bg-gray-200 text-gray-700 rounded disabled:opacity-50 hover:bg-gray-300 transition-colors text-sm font-medium">↩️ 復原動作</button>
                                    <button onClick={handleClearSeats} className="flex-1 py-2 bg-yellow-100 text-yellow-700 rounded hover:bg-yellow-200 transition-colors text-sm font-medium">🧹 清空座位</button>
                                    <button onClick={handleClearAll} className="flex-1 py-2 bg-red-100 text-red-600 rounded hover:bg-red-200 transition-colors text-sm font-medium">🗑️ 重置全部</button>
                                </div>
                            </div>
                        </div>

                        {/* 列印按鈕區 */}
                        <div className="p-4 bg-gray-50 border-t">
                            <button onClick={() => window.print()} className="w-full py-3 bg-indigo-600 text-white font-bold rounded shadow-md hover:bg-indigo-700 transition-colors flex items-center justify-center gap-2">
                                🖨️ 列印座位表
                            </button>
                        </div>
                    </div>

                    {/* 右側主畫面：座位表 (列印時展開至滿版) */}
                    <div className="flex-1 overflow-auto bg-gray-200 print-fullscreen flex items-center justify-center p-2 sm:p-4 md:p-8">
                        <div className="bg-white p-4 sm:p-8 rounded-2xl shadow-xl print:shadow-none print-fullscreen flex flex-col items-center min-w-max min-h-max">
                            
                            {/* 列印時才顯示的標題 */}
                            <div className="hidden print:block text-2xl font-bold mb-4 text-center text-black">
                                班級座位表 <span className="text-base font-normal text-gray-600 ml-2">({view === 'student' ? '學生視角' : '教師視角'})</span>
                            </div>

                            {/* 整個教室的容器 (依視角套用CSS旋轉) */}
                            <div 
                                className={`flex flex-col items-center transition-transform duration-700 ease-in-out`}
                                style={{ transform: view === 'teacher' ? 'rotate(180deg)' : 'rotate(0deg)' }}
                            >
                                {/* 黑板/大屏 指示器 */}
                                <div className="w-[90%] md:w-[80%] h-12 md:h-16 bg-gray-800 text-white flex items-center justify-center rounded-lg mb-6 md:mb-10 shadow-inner border-b-4 border-gray-900">
                                    <span 
                                        className="text-xl md:text-3xl font-bold tracking-widest"
                                        style={{ transform: view === 'teacher' ? 'rotate(180deg)' : 'rotate(0deg)' }}
                                    >
                                        🖥️ 黑板 / 大屏 🖥️
                                    </span>
                                </div>

                                {/* 座位陣列 */}
                                <div 
                                    className="grid gap-2 sm:gap-3 md:gap-4"
                                    style={{ gridTemplateColumns: `repeat(${cols}, minmax(0, 1fr))` }}
                                >
                                    {seats.map((seat, idx) => {
                                        // 依狀態決定外觀
                                        let bgColor = "bg-white";
                                        let textColor = "text-gray-800";
                                        let border = "border-2 border-gray-300";
                                        let shadow = "shadow-sm";

                                        if (seat.status === 'disabled') {
                                            bgColor = "bg-gray-100";
                                            border = "border-2 border-gray-300 border-dashed";
                                            textColor = "text-gray-400";
                                            shadow = "shadow-none";
                                        } else if (seat.status === 'locked') {
                                            bgColor = "bg-amber-50";
                                            border = "border-2 border-amber-400";
                                            textColor = "text-amber-900";
                                        } else if (seat.studentName) {
                                            bgColor = "bg-blue-50";
                                            border = "border-2 border-blue-400";
                                            textColor = "text-blue-900";
                                        }

                                        // 點擊交換時的 highlight
                                        if (swapSource === idx) {
                                            border = "border-2 border-red-500 ring-4 ring-red-200 ring-opacity-50";
                                        }

                                        return (
                                            <div
                                                key={seat.id}
                                                onClick={() => handleSeatClick(idx)}
                                                // 加大方格基礎尺寸，確保大字體有足夠空間
                                                className={`w-24 h-24 sm:w-32 sm:h-32 md:w-40 md:h-40 print:w-32 print:h-32 rounded-lg cursor-pointer ${bgColor} ${border} ${shadow} transition-all duration-200 hover:-translate-y-1 hover:shadow-md ${mode !== 'normal' ? 'hover:ring-2 hover:ring-indigo-300' : ''} relative`}
                                            >
                                                {/* 內部文字容器：當教室旋轉 180 度時，裡面的文字再倒轉 180 度負負得正，確保文字永遠正向 */}
                                                <div 
                                                    className="w-full h-full flex flex-col items-center justify-center select-none"
                                                    style={{ transform: view === 'teacher' ? 'rotate(180deg)' : 'rotate(0deg)', transition: 'transform 0.7s ease-in-out' }}
                                                >
                                                    {/* 姓名字體極大化：使用 text-3xl 到 text-5xl，並加上 leading-none 緊湊行距。列印時加上 print-text-adjust 避免太大破版 */}
                                                    <div className={`w-full flex items-center justify-center text-center font-black text-3xl sm:text-4xl md:text-5xl print-text-adjust break-words leading-none px-1 ${textColor}`}>
                                                        {seat.status === 'disabled' ? '❌' : (seat.studentName || '')}
                                                    </div>
                                                    
                                                    {/* 鎖定小圖示移至角落，避免干擾主要文字 */}
                                                    {seat.status === 'locked' && (
                                                        <div className="absolute top-1 right-1 text-sm">🔒</div>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
